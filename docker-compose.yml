services:
  backend:
    build: .
    container_name: openshorts-backend
    ports:
      - "8000:8000"
    # Bind-mount hides the image's /app (incl. baked yolov8n.pt) and is owned by
    # the host user, so appuser (uid 999) cannot write caches there. Point
    # caches at /tmp and keep a host-side yolov8n.pt (gitignored) for YOLO.
    environment:
      - YOLO_MODEL_PATH=/app/yolov8n.pt
      - MPLCONFIGDIR=/tmp/matplotlib
      - XDG_CACHE_HOME=/tmp/xdg-cache
      - HOME=/tmp
    volumes:
      - .:/app
      - /app/__pycache__
      - ./output:/app/output
    restart: unless-stopped

  frontend:
    build:
      context: ./dashboard
      target: dev
    container_name: openshorts-frontend
    ports:
      - "5175:5173"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - backend

  renderer:
    build:
      context: .
      dockerfile: render-service/Dockerfile
    container_name: openshorts-renderer
    ports:
      - "3100:3100"
    volumes:
      - ./output:/output
    environment:
      - REMOTION_BUNDLE_PATH=/app/remotion
      - OUTPUT_DIR=/output
      - PORT=3100
    restart: unless-stopped
    depends_on:
      - backend
